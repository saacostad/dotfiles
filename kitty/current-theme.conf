# vim:ft=kitty

## name:     Caelestia-Dynamic
## blurb:    Static copy of caelestia scheme (tonalspot, dark)

# The basic colors
foreground              #f8e1d6
background              #130d0a
selection_foreground    #130d0a
selection_background    #f7b99a

# Cursor colors
cursor                  #f7b99a
cursor_text_color       #130d0a

# URL underline color when hovering with mouse
url_color               #e6beac

# Kitty window border colors
active_border_color     #f7b99a
inactive_border_color   #54453d
bell_border_color       #f9e19c

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #130d0a
active_tab_background   #f7b99a
inactive_tab_foreground #f8e1d6
inactive_tab_background #211713
tab_bar_background      #120c09

# Colors for marks (marked text in the terminal)
mark1_foreground #130d0a
mark1_background #f7b99a
mark2_foreground #130d0a
mark2_background #e6beac
mark3_foreground #130d0a
mark3_background #f9e19c

# The 16 terminal colors

# black
color0 #353433
color8 #b39f94

# red
color1 #f86000
color9 #ff8852

# green
color2  #ffbe8b
color10 #ffd5b6

# yellow
color3  #ffe0ce
color11 #fff1eb

# blue
color4  #b9ab66
color12 #dcbc93

# magenta
color5  #f19175
color13 #ffaa8e

# cyan
color6  #ffbc75
color14 #ffd3ab

# white
color7  #eed3c4
